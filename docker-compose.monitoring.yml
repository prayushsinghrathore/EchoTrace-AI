# ═══════════════════════════════════════════════════════════════════════════════
# EchoTrace AI — Monitoring Stack (Docker Compose)
# ═══════════════════════════════════════════════════════════════════════════════
# Standalone monitoring stack for development and production environments.
#
# Usage:
#   docker compose -f docker-compose.monitoring.yml up -d
#
# For production, integrate these services into docker-compose.prod.yml
# or deploy via Kubernetes manifests.
# ═══════════════════════════════════════════════════════════════════════════════

name: echotrace-monitoring

services:
  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: echotrace-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=50GB"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - echotrace-network
    depends_on:
      - cadvisor
      - node-exporter
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: echotrace-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLISH: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - echotrace-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ── OpenTelemetry Collector ───────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: echotrace-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ./monitoring/otel:/etc/otel:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # OTel internal metrics
      - "8889:8889"   # OTel Prometheus exporter
    networks:
      - echotrace-network
    depends_on:
      - jaeger
      - tempo
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ── Jaeger ───────────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: echotrace-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC (shared — typically exposed via collector)
      - "14250:14250"  # Jaeger gRPC
    networks:
      - echotrace-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ── Grafana Tempo ─────────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    container_name: echotrace-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "3200:3200"   # Tempo query frontend
      - "4317:4317"   # OTLP gRPC (shared)
    networks:
      - echotrace-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ── Promscale (Long-term Prometheus) ─────────────────────────────────────
  # Uncomment for long-term metric storage:
  # promscale:
  #   image: timescale/promscale:latest
  #   ...

  # ── PostgreSQL Exporter ──────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: echotrace-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-echotrace}:${POSTGRES_PASSWORD:-echotrace_secret}@postgres:5432/${POSTGRES_DB:-echotrace}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - echotrace-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # ── Neo4j Exporter ───────────────────────────────────────────────────────
  neo4j-exporter:
    image: mneedham/neo4j-exporter:latest
    container_name: echotrace-neo4j-exporter
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-echotrace_neo4j}
    ports:
      - "7475:7474"
    networks:
      - echotrace-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # ── Node Exporter ────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: echotrace-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--path.procfss=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    pid: host
    ports:
      - "9100:9100"
    networks:
      - echotrace-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ── cAdvisor ─────────────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: echotrace-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "8080:8080"
    networks:
      - echotrace-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  echotrace-network:
    external: true

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
