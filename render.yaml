services:
  - type: web
    name: echotrace-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    healthCheckPath: /api/v1/ready
    envVars: &backend_env
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG
        value: "false"
      - key: DB_SSL_MODE
        value: require
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "3"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_ENABLED
        value: "true"
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          name: echotrace-redis
          type: keyvalue
          property: connectionString
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_REGION
        sync: false
      - key: STORAGE_S3_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_SECRET_KEY
        sync: false
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_PREFIX
        value: evidence
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: EchoTrace AI
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "false"
      - key: SMTP_USE_STARTTLS
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: PASSWORD_RESET_URL
        value: https://echo-trace-ai.vercel.app

  - type: worker
    name: echotrace-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.worker
    branch: main
    envVars: *backend_env

  - type: web
    name: echotrace-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    branch: main
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://echotrace-ai-kkta.onrender.com/api/v1
      - key: NEXT_PUBLIC_APP_URL
        value: https://echotrace-frontend.onrender.com
      - key: NEXT_PUBLIC_ENVIRONMENT
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: "3000"

  - type: keyvalue
    name: echotrace-redis
    plan: free
