# ═══════════════════════════════════════════════════════════════════════════════
# EchoTrace AI — Grafana Tempo Configuration
# ═══════════════════════════════════════════════════════════════════════════════

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000_000
  max_block_duration: 30m

compactor:
  compaction:
    block_retention: 336h  # 14 days

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/metrics
  traces_storage:
    path: /tmp/tempo/traces

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
