apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: echotrace
  labels:
    app.kubernetes.io/name: echotrace-ai
    app.kubernetes.io/component: neo4j
    app.kubernetes.io/part-of: echotrace
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: "5"
    environment: production
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/component: neo4j
        app.kubernetes.io/name: echotrace-ai
        app.kubernetes.io/part-of: echotrace
        environment: production
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: false
        fsGroup: 7474
      containers:
        - name: neo4j
          image: neo4j:5-enterprise
          imagePullPolicy: IfNotPresent
          ports:
            - name: bolt
              containerPort: 7687
              protocol: TCP
            - name: http
              containerPort: 7474
              protocol: TCP
          env:
            - name: NEO4J_AUTH
              value: "$(NEO4J_USER)/$(NEO4J_PASSWORD)"
            - name: NEO4J_USER
              valueFrom:
                configMapKeyRef:
                  name: echotrace-config
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: echotrace-secrets
                  key: NEO4J_PASSWORD
            - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
              valueFrom:
                configMapKeyRef:
                  name: echotrace-config
                  key: NEO4J_ACCEPT_LICENSE
            - name: NEO4J_dbms_memory_pagecache_size
              value: "512M"
            - name: NEO4J_dbms_memory_heap_max__size
              value: "1G"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            exec:
              command:
                - cypher-shell
                - -u
                - neo4j
                - -p
                - "$(NEO4J_PASSWORD)"
                - "RETURN 1"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - cypher-shell
                - -u
                - neo4j
                - -p
                - "$(NEO4J_PASSWORD)"
                - "RETURN 1"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 5
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
              readOnly: false
            - name: neo4j-logs
              mountPath: /logs
              readOnly: false
          securityContext:
            runAsUser: 7474
            runAsGroup: 7474
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      volumes:
        - name: neo4j-data
          persistentVolumeClaim:
            claimName: echotrace-neo4j-data
        - name: neo4j-logs
          persistentVolumeClaim:
            claimName: echotrace-neo4j-logs
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: echotrace
  labels:
    app.kubernetes.io/name: echotrace-ai
    app.kubernetes.io/component: neo4j
    app.kubernetes.io/part-of: echotrace
    app.kubernetes.io/managed-by: kubectl
    environment: production
spec:
  type: ClusterIP
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
      protocol: TCP
    - name: http
      port: 7474
      targetPort: 7474
      protocol: TCP
  selector:
    app.kubernetes.io/component: neo4j
