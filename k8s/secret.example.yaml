apiVersion: v1
kind: Secret
metadata:
  name: echotrace-secrets
  namespace: echotrace
  labels:
    app.kubernetes.io/name: echotrace-ai
    app.kubernetes.io/part-of: echotrace
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kubectl
    environment: production
type: Opaque
stringData:
  # ═══════════════════════════════════════════════════════════════════════════
  # EchoTrace AI — Secret Configuration (Example)
  # ═══════════════════════════════════════════════════════════════════════════
  # Copy this file to secrets.yaml, fill in your production values, and apply:
  #
  #   kubectl apply -f k8s/secrets.yaml
  #
  # WARNING: Never commit secrets.yaml to version control.
  # For production, use an external secrets manager:
  #   - HashiCorp Vault via CSI Provider
  #   - AWS Secrets Manager / GCP Secret Manager
  #   - Sealed Secrets (bitnami/sealed-secrets)
  #   - External Secrets Operator
  #
  # Generate secrets with:
  #   openssl rand -hex 32   (for SECRET_KEY and database passwords)
  # ═══════════════════════════════════════════════════════════════════════════

  # JWT signing key — 64 hex characters, REQUIRED in production
  SECRET_KEY: "replace-with-64-char-hex-random-string-at-least-32-chars"

  # PostgreSQL
  POSTGRES_PASSWORD: "replace-with-strong-random-password"

  # Neo4j
  NEO4J_PASSWORD: "replace-with-strong-neo4j-password"

  # ── AI Providers ─────────────────────────────────────────────────────────
  # Only configure the provider you use. Leave others empty.

  # OpenAI
  OPENAI_API_KEY: "sk-your-openai-api-key-here"

  # Azure OpenAI
  AZURE_OPENAI_KEY: "your-azure-openai-key"

  # ── Storage (S3-compatible) ──────────────────────────────────────────────
  # Only needed if STORAGE_PROVIDER is not "local"
  STORAGE_S3_ACCESS_KEY: "your-s3-access-key"
  STORAGE_S3_SECRET_KEY: "your-s3-secret-key"
