apiVersion: v1
kind: ConfigMap
metadata:
  name: echotrace-config
  namespace: echotrace
  labels:
    app.kubernetes.io/name: echotrace-ai
    app.kubernetes.io/part-of: echotrace
    app.kubernetes.io/component: config
    app.kubernetes.io/managed-by: kubectl
    environment: production
data:
  # ── Application ───────────────────────────────────────────────────────────
  PROJECT_NAME: "EchoTrace AI"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_V1_PREFIX: "/api/v1"
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "echotrace"
  POSTGRES_USER: "echotrace"

  # ── Neo4j ────────────────────────────────────────────────────────────────
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_DATABASE: "neo4j"
  NEO4J_ACCEPT_LICENSE: "no"

  # ── AI / LLM ─────────────────────────────────────────────────────────────
  AI_PROVIDER: "openai"
  AI_PROMPT_VERSION: "1.0.0"
  AI_MAX_TOKENS: "4096"
  AI_MAX_INPUT_TOKENS: "32000"
  AI_TIMEOUT_SECONDS: "120"
  AI_CHUNK_SIZE: "16000"
  AI_SUMMARIZE_MAX_CHARS: "100000"
  AI_CACHE_ENABLED: "true"
  AI_CACHE_TTL_SECONDS: "3600"
  OPENAI_MODEL: "gpt-4o"
  OLLAMA_MODEL: "llama3"

  # ── Rate Limiting ────────────────────────────────────────────────────────
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_LOGIN_MAX: "10"
  RATE_LIMIT_LOGIN_WINDOW: "300"
  RATE_LIMIT_REGISTER_MAX: "5"
  RATE_LIMIT_REGISTER_WINDOW: "3600"
  RATE_LIMIT_REFRESH_MAX: "20"
  RATE_LIMIT_REFRESH_WINDOW: "900"
  RATE_LIMIT_RESET_MAX: "3"
  RATE_LIMIT_RESET_WINDOW: "3600"

  # ── Authentication ───────────────────────────────────────────────────────
  AUTH_USE_COOKIES: "true"
  AUTH_COOKIE_SAMESITE: "lax"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  PASSWORD_RESET_TOKEN_EXPIRE_HOURS: "24"

  # ── Storage ──────────────────────────────────────────────────────────────
  STORAGE_PROVIDER: "local"
  STORAGE_LOCAL_PATH: "/app/storage"
  MAX_UPLOAD_SIZE_MB: "500"

  # ── Database Pool ────────────────────────────────────────────────────────
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
  DB_ECHO: "false"

  # ── CORS ─────────────────────────────────────────────────────────────────
  BACKEND_CORS_ORIGINS: '["https://app.echotrace.example.com","https://api.echotrace.example.com"]'
