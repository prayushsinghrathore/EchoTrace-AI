name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend Lint ──────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt

      - name: Run Ruff lint check
        run: ruff check . --output-format=github

      - name: Run Ruff format check
        run: ruff format . --check

      - name: Run mypy
        run: mypy app --ignore-missing-imports

      - name: Run bandit security scan
        run: pip install bandit && bandit -r app/ -ll -f github

  # ── Backend Tests ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing -v
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          flags: backend

  # ── Frontend Lint ─────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run type-check

  # ── Frontend Build ────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_ENVIRONMENT: ci

  # ── Docker Build (CI-only, no push) ───────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: echotrace-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: echotrace-frontend:ci

  # ── YAML Validation ───────────────────────────────────────────────────────
  yaml-validate:
    name: YAML Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" .

  # ── Docker Integration Smoke Test ────────────────────────────────────────
  integration-smoke:
    name: Docker Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, docker-build]

    steps:
      - uses: actions/checkout@v4

      - name: Start backend dependency stack
        run: docker compose up -d --build postgres neo4j redis backend worker

      - name: Wait for services
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/live >/dev/null \
              && docker compose exec -T neo4j cypher-shell -u neo4j -p echotrace_neo4j 'RETURN 1' >/dev/null \
              && docker compose exec -T redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100 backend worker neo4j postgres redis
          exit 1

      - name: Verify integration workflow
        env:
          TEST_EMAIL: integration-${{ github.run_id }}@example.com
        run: |
          set -eu
          curl --fail --silent --show-error http://127.0.0.1:7474/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/live >/dev/null
          docker compose ps --status running worker

          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${TEST_EMAIL}\",\"password\":\"SecureP@ss1\",\"display_name\":\"Integration Test\"}" \
            >/tmp/register.json

          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8000/api/v1/auth/forgot-password \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${TEST_EMAIL}\"}" \
            >/tmp/password-reset.json

          grep -q 'reset link has been sent' /tmp/password-reset.json

      - name: Stop integration stack
        if: always()
        run: docker compose down -v --remove-orphans
